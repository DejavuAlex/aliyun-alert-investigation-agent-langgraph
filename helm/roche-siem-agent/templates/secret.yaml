{{- if and .Values.secret.enabled (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roche-siem-agent.fullname" . }}-secret
  labels:
    {{- include "roche-siem-agent.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $k, $v := .Values.secret.data }}
  {{- $kind := kindOf $v }}
  {{- if eq $kind "string" }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- else }}
  {{ $k }}: {{ toJson $v | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
